listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO
isolate=NO
isolate_network=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/home/dackel/ftp
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30019
port_enable=YES
connect_from_port_20=NO
# FXP: allow data connections from/to other hosts than the control client
pasv_promiscuous=YES
port_promiscuous=YES
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=NO
force_local_logins_ssl=NO
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
# The point of this test: data connections must resume the control TLS session
require_ssl_reuse=YES
ssl_ciphers=HIGH
rsa_cert_file=/etc/ssl/certs/vsftpd.pem
rsa_private_key_file=/etc/ssl/private/vsftpd.key
xferlog_enable=YES
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log
utf8_filesystem=YES
